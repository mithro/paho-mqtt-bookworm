# What kind of packaging repository this is, and why it differs from the
# defaults: mithro/apt-repo-action's docs/packaging.md ("The declaration").
kind = "A"
variant = "backport"
upstream = "https://tracker.debian.org/pkg/python-paho-mqtt"
architectures = "all"
suites = ["bookworm"]

[exceptions]
PKG-SUITES = "backport: paho-mqtt 2.x for bookworm, needed by sensors2mqtt there"
